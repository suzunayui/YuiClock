<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>YuiClock 設定</title>
    <link rel="stylesheet" href="settings.css" />
    <script src="format.js" defer></script>
    <script src="settings.js" defer></script>
  </head>
  <body>
    <form id="form">
      <label class="row">
        <span>文字色</span>
        <input type="color" name="textColor" />
      </label>
      <label class="row">
        <span>背景色</span>
        <input type="color" name="backgroundColor" />
      </label>
      <label class="row">
        <span>フォント</span>
        <select name="fontFamily"></select>
      </label>
      <label class="check sub">
        <input type="checkbox" id="monoOnly" checked />
        <span>等幅フォントだけ表示</span>
      </label>
      <div id="preview"><span id="previewDate"></span><span id="previewTime"></span></div>
      <label class="row">
        <span>角の丸さ</span>
        <span class="range">
          <input type="range" name="cornerRadius" min="0" max="100" step="1" />
          <output id="radiusValue"></output>
        </span>
      </label>
      <label class="check">
        <input type="checkbox" name="alwaysOnTop" />
        <span>最前面に表示</span>
      </label>
      <label class="check">
        <input type="checkbox" name="bold" />
        <span>太字</span>
      </label>
      <label class="check">
        <input type="checkbox" name="showDate" />
        <span>日付と曜日を表示</span>
      </label>
      <label class="row">
        <span>曜日の表記</span>
        <select name="weekdayFormat">
          <option value="short-ja">日</option>
          <option value="long-ja">日曜日</option>
          <option value="long-en">Sunday</option>
          <option value="short-en">Sun</option>
        </select>
      </label>
      <label class="check">
        <input type="checkbox" name="showSeconds" />
        <span>秒を表示</span>
      </label>
      <p class="hint">フォントの一覧は PC に入っているものから作っています。変更はすぐ時計に反映されます。</p>
      <div class="buttons">
        <button type="button" id="reset">初期設定に戻す</button>
        <button type="button" id="close">閉じる</button>
      </div>
    </form>
  </body>
</html>
