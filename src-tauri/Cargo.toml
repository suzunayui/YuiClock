[package]
name = "yui-clock"
version = "2026.1108.3"
description = "Always-on-top desktop digital clock"
authors = ["suzunayui"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: transparent windows on macOS (macOSPrivateApi in tauri.conf.json). It does nothing on Windows.
tauri = { version = "2", features = ["custom-protocol", "tray-icon", "macos-private-api"] }
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_DirectWrite"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-text = "21"
core-foundation = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
